{{- if .Values.checkpointStoreAgent.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "checkpoint-restore-operator.storeAgent.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "checkpoint-restore-operator.labels" . | nindent 4 }}
  {{- with .Values.checkpointStoreAgent.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "checkpoint-restore-operator.storeAgent.name" . }}
  labels:
    {{- include "checkpoint-restore-operator.labels" . | nindent 4 }}
rules:
  # Reads the storage configuration.
  - apiGroups: ["criu.org"]
    resources: ["checkpointrestoreoperators"]
    verbs: ["get", "list", "watch"]
  # Downloads for the PodRestores on its node and reports the download.
  - apiGroups: ["criu.org"]
    resources: ["podrestores"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["criu.org"]
    resources: ["podrestores/status"]
    verbs: ["get", "patch"]
  # Files each snapshot under the workload that owns the checkpointed pod.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "checkpoint-restore-operator.storeAgent.name" . }}
  labels:
    {{- include "checkpoint-restore-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "checkpoint-restore-operator.storeAgent.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "checkpoint-restore-operator.storeAgent.name" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
